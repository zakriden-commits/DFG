<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Michael Myers — третье лицо</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🔪</text></svg>"

    <link rel="stylesheet" href="/src/game/style.css" />

  <body>
    <canvas id="scene"></canvas>

          <div><dt>Он</dt><dd id="gState">стоит</dd></div>

          <div><dt>Место</dt><dd id="gPlace">жёлтая пустота</dd></div>
        </dl>
        <div id="gNote">3D: —</div>
      </div>

      <div id="gHint">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> идти</span>
        <span class="sep"></span>
        <span><kbd>Shift</kbd> быстрее</span>
        <span class="sep"></span>
        <span>клик — захват мыши · колесо — зум</span>
      </div>

      <div id="gLinks">
        <a class="keep-token" href="./first-person.html">погоня от первого лица →</a>
        <a class="keep-token" href="./rig.html">риг и клипы →</a>

    </div>

    <script type="module" src="/src/game/main.js"></script>
