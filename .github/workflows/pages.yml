name: Pages

# Запуск вручную: вкладка Actions → Pages → Run workflow.
# После того как в Settings → Pages выбран источник «GitHub Actions», деплой проходит сам.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/e0cbc734-dfg

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверки без браузера
        run: |
          node test/fps-chase.mjs
          node test/probe-model.mjs > /dev/null
          node test/verify-export.mjs assets/models/character.glb

      - name: Сборка
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
